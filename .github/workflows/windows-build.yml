name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package playtest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path playtest | Out-Null
          Copy-Item build/bin/Release/stoneveil.exe playtest/stoneveil.exe
          Copy-Item build/bin/Release/content playtest/content -Recurse
      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: STONEVEIL-Windows-Playtest
          path: playtest/
          if-no-files-found: error
